workflows:
  ios-test-unsigned:
    name: iOS Test Build (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Package as .ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r psas-unsigned.ipa Payload
    artifacts:
      - psas-unsigned.ipa

  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Create an App Store Connect API key integration in Codemagic > Team settings > Integrations,
    # then reference its name here. It replaces manual certificate/provisioning profile management.
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.psas.booking"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificate to keychain
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Fetch signing files
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/certificate_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$(cat /tmp/certificate_key.pem)" \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles \
            --custom-export-options '{"signingCertificate": "Apple Distribution"}'
      - name: Build ipa
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - name: Upload dSYMs to Crashlytics
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npx --yes firebase-tools crashlytics:symbols:upload \
            --app 1:100021036305:ios:d99f7bf0e0265f151298b0 \
            build/ios/archive/Runner.xcarchive/dSYMs
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true