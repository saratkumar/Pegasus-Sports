<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — PSAS</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    color: #1a1a1a;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  .icon { font-size: 48px; line-height: 1; }
  h1 { font-size: 1.4em; margin: 16px 0 8px; }
  p { color: #555; line-height: 1.5; margin: 0; }
  .ok { color: #1a9e5c; }
  .cancel { color: #FF7A00; }
</style>
</head>
<body>
<div class="card">
  <div id="icon" class="icon ok">&#10004;</div>
  <h1 id="title">Payment received</h1>
  <p id="msg">You can close this tab and return to the PSAS shop — your plan
    will be activated there automatically within a few seconds.</p>
</div>
<script>
  // Stripe Checkout returns here (see createCheckoutSession in
  // functions/index.js). Activation happens in the original shop tab, which
  // polls the session — this page only tells the member to go back.
  if (new URLSearchParams(location.search).get('status') === 'cancel') {
    document.getElementById('icon').className = 'icon cancel';
    document.getElementById('icon').innerHTML = '&#10006;';
    document.getElementById('title').textContent = 'Payment cancelled';
    document.getElementById('msg').textContent =
      'No payment was taken. You can close this tab and return to the PSAS shop.';
  }
</script>
</body>
</html>
